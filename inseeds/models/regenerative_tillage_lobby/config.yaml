# Settings for LPJmL specifically for coupling (pycoupler)
#   (not covered by LPJmL's direct config)
lpjml_settings:
    country_code_to_name: true
    iso_country_code: true

# Variables to be written to copan_core_data table file 
output:
    farmer:
        - "aft_id"
        - "tillage"
        - "tpb"
        - "pbc"
        - "social_norm"
        - "attitude"
        - "attitude_own_land"
        - "attitude_social_learning"
        - "soilc"
        - "cropyield"
        - "received_subsidy"
    decisionmaker:
        - "decision_maker_id"
        - "belief_value"
        - "world_average_cropyield"
        - "world_average_soilc"
    lobbygroup:
        - "lobby_group_id"
        - "aft_type"
        - "belief_value"
        - "count_0"
        - "count_1"
        - "majority"
        - "agreement"
        - "contributed_yield"
        - "farmer_count"
    world:
        - "shared_subsidy_budget"
        - "subsidy_plan"
        - "land_based_subsidies"
        - "practice_based_subsidies"


# Define how copan_core_data table file should be written
output_settings:
    write_lon_lat: true
    file_format: "csv" # "parquet" "csv"

# Define which farmer variables map with coupled LPJmL input variables
coupling_map:
    tillage: ["with_tillage"]
    # residues: ["residue_on_field"]

control_run: False
pioneer_share: 0.25
num_decision_makers: 3

# Subsidy policy configuration
# subsidy_plan: -5 (100% land-based) to 5 (100% practice-based)
# 0 = balanced (50% land, 50% practice)
subsidy_plan: -5

# Analogous to LPJmL pftpar, define the AFT parameters for the two different
#   farmer types
aftpar:
    # AFT for conservative/traditional values following farmer tending to stay
    #   with conventional agriculture
    traditionalist:
        pbc: 0.75
        weight_attitude: 0.6
        weight_yield: 0.8
        weight_soil: 0.4
        weight_norm: 0.4
        weight_social_learning: 0.4
        weight_own_land: 0.6
        # duration of waiting time before switching to another strategy
        strategy_switch_duration: 10 # years

    # AFT for pioneer farmer who more likely tends to switch to new (promising)
    #   regenerative agriculture practices
    pioneer:
        pbc: 0.95
        weight_attitude: 0.8
        weight_yield: 0.4
        weight_soil: 0.8
        weight_norm: 0.2
        weight_social_learning: 0.6
        weight_own_land: 0.4
        # duration of waiting time before switching to another strategy
        strategy_switch_duration: 10 # years
